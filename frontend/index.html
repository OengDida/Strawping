<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f5f2" />
    <meta name="description" content="Shop thoughtfully selected motorcycle gear and riding equipment at Strawping." />
    <script type="module" src="/src/theme-bootstrap.js"></script>
    <title>Strawping — Motorcycle Gear</title>
    <style>
      html,body{margin:0;background:#f6f5f2;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
      .preboot{min-height:100svh;overflow:hidden}.preboot-nav{height:56px;margin:12px 12px 0;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border:1px solid rgba(0,0,0,.08);border-radius:16px;background:rgba(255,255,255,.62)}
      .preboot-brand{font-size:15px;font-weight:700}.preboot-actions{display:flex;gap:9px}.preboot-dot{width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.06)}
      .preboot-hero{max-width:1120px;margin:auto;padding:clamp(70px,12vh,130px) 22px 48px;display:grid;grid-template-columns:1.2fr .8fr;gap:48px;align-items:center;min-height:62svh;box-sizing:border-box}
      .preboot-kicker{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#89857f}.preboot-title{font-size:clamp(58px,10vw,120px);line-height:.9;letter-spacing:-.07em;margin:24px 0;font-weight:700}.preboot-copy{max-width:420px;color:#666;font-size:17px;line-height:1.6}.preboot-cta{display:inline-flex;margin-top:26px;padding:15px 25px;border-radius:999px;background:#171717;color:white;text-decoration:none;font-size:14px}
      .preboot-image{aspect-ratio:4/5;max-height:500px;border-radius:28px;background:linear-gradient(135deg,#e7e4de,#d8d4cc)}.preboot-shop{max-width:1120px;margin:0 auto;padding:24px 22px 90px}.preboot-shop h2{font-size:34px;letter-spacing:-.05em}.preboot-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.preboot-card{height:230px;border-radius:22px;background:linear-gradient(110deg,#e9e6e0 25%,#f0eeea 38%,#e9e6e0 62%);background-size:300% 100%;animation:preboot-shimmer 1.8s ease-in-out infinite}
      @keyframes preboot-shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
      @media(max-width:700px){.preboot-nav{margin:8px 8px 0}.preboot-hero{grid-template-columns:1fr;gap:28px;padding-top:58px;min-height:auto}.preboot-title{margin:18px 0}.preboot-image{display:none}.preboot-shop{padding-top:18px}.preboot-cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.preboot-card{height:180px}}
      @media(prefers-color-scheme:dark){html,body{background:#0c0c0d;color:#f2f1ee}.preboot-nav{background:rgba(44,44,48,.6);border-color:rgba(255,255,255,.1)}.preboot-dot{background:rgba(255,255,255,.1)}.preboot-kicker,.preboot-copy{color:#aaa}.preboot-image,.preboot-card{background-color:#1a1a1b}.preboot-card{background-image:linear-gradient(110deg,#1a1a1b 25%,#252527 38%,#1a1a1b 62%)}.preboot-cta{background:#f2f1ee;color:#171717}}
      @media(prefers-reduced-motion:reduce){.preboot-card{animation:none}}
    </style>
  </head>
  <body>
    <div id="root">
      <div class="preboot" role="status" aria-label="Loading Strawping storefront">
        <header class="preboot-nav"><span class="preboot-brand">Strawping</span><span class="preboot-actions" aria-hidden="true"><i class="preboot-dot"></i><i class="preboot-dot"></i><i class="preboot-dot"></i></span></header>
        <main>
          <section class="preboot-hero"><div><p class="preboot-kicker">Made by riders</p><h1 class="preboot-title">Strawp<br> Moto.</h1><p class="preboot-copy">Helmets, gloves, luggage and armour — selected for fit, finish and certified protection.</p><a class="preboot-cta" href="#shop">Explore Gear&nbsp; →</a></div><div class="preboot-image" aria-hidden="true"></div></section>
          <section class="preboot-shop" id="shop"><p class="preboot-kicker">Shop</p><h2>The Collection</h2><div class="preboot-cards" aria-hidden="true"><div class="preboot-card"></div><div class="preboot-card"></div><div class="preboot-card"></div><div class="preboot-card"></div></div></section>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
